<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTO Preflop Trainer</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="page-center">
    <div class="hero-card">
      <h1 class="logo">GTO Preflop Trainer</h1>
      <p class="subtitle">6-max NL · GTO-adapted ranges · Progress tracking</p>

      <div class="home-actions">
        <a href="/quiz" class="btn btn-primary btn-lg">Start Quiz</a>
        <a href="/dashboard" class="btn btn-secondary btn-lg">Dashboard</a>
      </div>

      <div class="home-info">
        <div class="info-item">
          <span class="info-label">Scenarios</span>
          <span class="info-value">RFI · vs Open (F/C/3B)</span>
        </div>
        <div class="info-item">
          <span class="info-label">Positions</span>
          <span class="info-value">UTG · HJ · CO · BTN · SB · BB</span>
        </div>
        <div class="info-item">
          <span class="info-label">Ranges</span>
          <span class="info-value">GTO-adapted for NL10–NL50</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
